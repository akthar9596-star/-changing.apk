name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate Android Project and Gradle Wrapper
        id: locate-project
        run: |
          echo "Searching for Gradle wrapper (gradlew)..."
          GRADLEW_PATH=$(find . -maxdepth 4 -name "gradlew" -type f | head -n 1)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::Android project or Gradle wrapper (gradlew) not found in the repository!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Android project detected at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

          # Grant execution permissions
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Clean Project Caches
        run: |
          echo "Cleaning stale Gradle and build caches in $PROJECT_DIR..."

          # Remove generated .gradle directory in the Android project root
          if [ -d "$PROJECT_DIR/.gradle" ]; then
            rm -rf "$PROJECT_DIR/.gradle"
            echo "Removed $PROJECT_DIR/.gradle"
          fi

          # Remove build directories safely
          find "$PROJECT_DIR" -type d -name "build" -exec rm -rf {} + 2>/dev/null || true
          echo "Cleaned build directories."

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          echo "Building debug APK using Gradle wrapper..."
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and Verify Generated APK
        id: locate-apk
        run: |
          echo "Searching for generated APK files in $PROJECT_DIR..."

          # Search for debug .apk files inside build output directories
          APK_PATHS=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/*.apk" -o -type f -path "*/build/outputs/apk/*/*.apk")

          if [ -z "$APK_PATHS" ]; then
            # Fallback search for any .apk file created in project directory
            APK_PATHS=$(find "$PROJECT_DIR" -type f -name "*.apk")
          fi

          if [ -z "$APK_PATHS" ]; then
            echo "::error::No APK file was generated by the build process!"
            exit 1
          fi

          echo "Generated APK(s) found:"
          echo "$APK_PATHS"

          # Use first APK found for upload path verification
          FIRST_APK=$(echo "$APK_PATHS" | head -n 1)
          echo "apk_path=$FIRST_APK" >> $GITHUB_OUTPUT
          echo "APK_PATHS=$APK_PATHS" >> $GITHUB_ENV

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: ${{ steps.locate-apk.outputs.apk_path }}
          if-no-files-found: error
